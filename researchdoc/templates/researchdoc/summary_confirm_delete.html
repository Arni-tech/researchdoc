{% extends "researchdoc/base.html" %}

{% block title %}ResearchDoc - Delete Summary{% endblock %}

{% block content %}

<div class="py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h1 class="h2 mb-3">Delete Summary</h1>

                        <p>
                            Are you sure you want to delete
                            <strong>{{ summary.title }}</strong>?
                        </p>

                        <p class="text-muted">
                            Any citations linked to this summary will also be removed.
                        </p>

                        <form method="post">
                            {% csrf_token %}

                            <button type="submit" class="btn btn-danger">Yes, Delete Summary</button>
                            <a href="{% url 'project_detail' project.id %}" class="btn btn-outline-secondary">Cancel</a>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
